name: Publicar no Instagram

on:
  schedule:
    - cron: "3-59/5 * * * *"   # a cada 5 min, fora dos minutos de pico (o GitHub atrasa ou pula rodadas agendadas)
  push:
    paths: ["posts/**/post.json", "scripts/publicar.py"]
  workflow_dispatch:
    inputs:
      verificar:
        description: "Só testar a conexão com o Instagram (não publica)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar conexão
        if: ${{ inputs.verificar }}
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python scripts/publicar.py --descobrir
          if [ -n "$IG_USER_ID" ]; then python scripts/publicar.py --verificar; fi

      # O agendador do GitHub atrasa às vezes horas. Quando um post vence nas próximas horas,
      # o run fica esperando até o horário exato e pega a versão mais nova do repositório.
      - name: Esperar o horário do próximo post
        if: ${{ !inputs.verificar }}
        run: |
          python scripts/publicar.py --esperar
          git pull --ff-only -q origin main

      - name: Publicar posts agendados
        if: ${{ !inputs.verificar }}
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/publicar.py

      - name: Salvar status
        if: ${{ always() && !inputs.verificar }}
        run: |
          git config user.name "publicador-instagram"
          git config user.email "actions@github.com"
          git add posts
          if ! git diff --cached --quiet; then
            git commit -m "Status de publicação [skip ci]"
            for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 5; done
          fi
