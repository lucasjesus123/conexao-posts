name: Publicar no Instagram

on:
  schedule:
    - cron: "3-59/5 * * * *"   # a cada 5 min, fora dos minutos de pico (o GitHub atrasa ou pula rodadas agendadas)
  push:
    paths: ["posts/**/post.json", "scripts/publicar.py"]
  workflow_dispatch:
    inputs:
      verificar:
        description: "Só testar a conexão com o Instagram (não publica)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-instagram-v2
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar conexão
        if: ${{ inputs.verificar }}
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python scripts/publicar.py --descobrir
          if [ -n "$IG_USER_ID" ]; then python scripts/publicar.py --verificar; fi

      # O agendador do GitHub atrasa às vezes horas. Por isso este passo fica acordado:
      # espera o horário de cada post que vence nas próximas ~5h40, publica na hora exata,
      # salva o status e segue para o próximo.
      - name: Publicar na hora certa
        if: ${{ !inputs.verificar }}
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          export INICIO_RUN=$(date +%s)
          git config user.name "publicador-instagram"
          git config user.email "actions@github.com"
          erro=0
          for i in $(seq 1 12); do
            rc=0; python scripts/publicar.py --esperar || rc=$?
            [ $rc -ne 0 ] && [ $rc -ne 3 ] && { erro=1; break; }
            [ $rc -eq 3 ] && break
            git pull --rebase -q origin main
            python scripts/publicar.py || erro=1
            git add posts
            if ! git diff --cached --quiet; then
              git commit -q -m "Status de publicação [skip ci]"
              for t in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
            fi
          done
          exit $erro
