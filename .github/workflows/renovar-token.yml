name: Renovar token do Instagram

on:
  schedule:
    - cron: "17 12 * * 1"   # toda segunda, 09:17 (horário de Brasília)
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pynacl
      - env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/renovar_token.py
